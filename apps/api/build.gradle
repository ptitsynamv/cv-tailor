plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'io.github.ptitsynamv'
version = '0.0.1-SNAPSHOT'
description = 'cv-tailor backend'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'com.anthropic:anthropic-java:3.2.0'
	implementation 'io.github.openhtmltopdf:openhtmltopdf-pdfbox:1.1.95'
	implementation 'org.jsoup:jsoup:1.23.2'
	// Used directly by ProfileLoader for contacts.yaml; version managed by the Boot BOM.
	implementation 'org.yaml:snakeyaml'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
