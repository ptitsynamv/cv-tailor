spring.application.name=cv-tailor-api
# Errors (validation, failed Claude calls) are returned as RFC 9457 problem JSON.
spring.mvc.problemdetails.enabled=true

# Profile folder (career-ops layout). Relative paths resolve from the working directory,
# which is apps/api when started with ./gradlew bootRun. Set PROFILE_DIR to use your real profile.
app.profile.dir=${PROFILE_DIR:../../demo-profile}

# Where generated PDFs are saved, one folder per application. Empty: download only.
# For real applications: OUTPUT_DIR=../../../career-ops/applications
app.documents.output-dir=${OUTPUT_DIR:}

app.claude.model=claude-opus-5-5
app.claude.max-tokens=16000
